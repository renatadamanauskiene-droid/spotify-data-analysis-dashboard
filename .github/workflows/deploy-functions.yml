name: Deploy Supabase Edge Functions

# Automatiškai įdiegia Edge Functions į Supabase, kai pasikeičia jų kodas (arba paleidus rankiniu
# būdu per Actions -> Run workflow). Vienintelis reikalingas repo sekretas: SUPABASE_ACCESS_TOKEN
# (gaunamas Supabase Dashboard -> Account -> Access Tokens). DB migracijos (įsk. pg_cron grafiką)
# paleidžiamos atskirai per SQL editorių — žr. supabase/DEPLOY.md.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: wmhvjwuzxgwlqxgkksfa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ingest-rss ingest-gnss compute-risk-and-notify ingest-aviation register-push-subscription; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::endgroup::"
          done
