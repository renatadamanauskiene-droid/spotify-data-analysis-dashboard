name: Ingest LT72 Alerts

# PASTABA: lt72.lt perspėjimų ingestion'ą atlieka Cloudflare Worker (workers/lt72-proxy/),
# ne šis workflow'as. Worker veikia kas 5 min naudodamas CF cron trigger ir
# rašo į Supabase tiesiogiai. Šis failas yra rezervinis — aktyvus tik kai
# Worker yra laikinai nepasiekiamas arba naudojamas kaip manual override.
#
# Pirmiausia reikia:
# 1. Worker: CF Dashboard → lt72-proxy → Settings → Add secret: SUPABASE_SERVICE_KEY
# 2. Worker: redeploy (npx wrangler deploy arba CF Dashboard paste)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Priežastis (neprivaloma)'
        required: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Statusas
        run: |
          echo "lt72 ingestion vykdomas per Cloudflare Worker (cron)."
          echo "Worker URL: žr. Cloudflare Dashboard → Workers & Pages → lt72-proxy"
          echo "Jei Worker neveikia — patikrink CF Dashboard → lt72-proxy → Logs"
          echo "Ir įsitikink, kad SUPABASE_SERVICE_KEY secret yra nustatytas."
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual trigger priežastis: ${{ github.event.inputs.reason }}"
          fi
